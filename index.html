<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slap Fighter" />
    <title>Slap Fighter</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1020;
        --yellow: #ffc93c;
        --red: #e8304a;
        --pink: #ff3d8b;
        --cyan: #35c8f0;
        --cream: #fff7e8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--ink);
        color: var(--cream);
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        font-weight: 800;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }
      #rotate .title {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 30px;
        color: var(--yellow);
        transform: rotate(-4deg);
        text-shadow: 3px 3px 0 var(--red);
      }
      #rotate .phone {
        width: 54px;
        height: 92px;
        border: 6px solid var(--cream);
        border-radius: 12px;
        animation: tilt 1.8s ease-in-out infinite;
      }
      #rotate p {
        margin: 0;
        font-size: 18px;
      }
      @keyframes tilt {
        0%, 20% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      @media (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div class="title">SLAP FIGHTER</div>
      <div class="phone" aria-hidden="true"></div>
      <p>Tourne ton téléphone<br />pour en mettre une !</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
