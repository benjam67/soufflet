  <body>
    <div id="game"></div>
    <div id="lobby" hidden data-show="choice">
      <div class="panel">
        <div class="ttl">EN LIGNE</div>
        <div data-view="choice">
          <p>Chacun sur son téléphone, avec un code de salon.</p>
          <div class="row">
            <button data-act="create">CRÉER UN SALON</button>
            <button data-act="join" class="alt">REJOINDRE</button>
          </div>
        </div>
        <div data-view="host">
          <p>Donne ce code à ton adversaire :</p>
          <div class="code" id="lobby-code-show">····</div>
          <div class="row"><button data-act="share" class="alt">PARTAGER LE LIEN</button></div>
          <p class="status" data-status>En attente de ton adversaire…</p>
        </div>
        <div data-view="join">
          <p>Code du salon :</p>
          <input id="lobby-code" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go" aria-label="Code du salon" />
          <div class="row"><button data-act="go">C’EST PARTI</button></div>
          <p class="status" data-status></p>
        </div>
        <div data-view="busy">
          <p class="status" data-status>Connexion…</p>
        </div>
        <button data-act="back" class="back">← RETOUR</button>
      </div>
    </div>
    <div id="netlost" hidden role="status">CONNEXION PERDUE…<small>On attend ton adversaire, la partie reprendra toute seule.</small></div>
    <div id="rotate" role="alert">
      <div class="title">SLAP FIGHTER</div>
      <div class="phone" aria-hidden="true"></div>
      <p>Tourne ton téléphone<br />pour en mettre une !</p>
    </div>
