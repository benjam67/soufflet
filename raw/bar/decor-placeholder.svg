<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2f2a"/>
      <stop offset="1" stop-color="#7a4232"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a36"/>
      <stop offset="1" stop-color="#3e2a20"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4f2c"/>
      <stop offset="1" stop-color="#5c3219"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffd27a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e4a"/>
      <stop offset="1" stop-color="#3b2a5c"/>
    </linearGradient>
    <pattern id="tiles" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#6e4c37"/>
      <rect width="40" height="20" fill="#7d5840"/>
      <rect x="40" y="20" width="40" height="20" fill="#7d5840"/>
    </pattern>
  </defs>

  <!-- Mur du fond -->
  <rect width="1600" height="560" fill="url(#wall)"/>
  <!-- Lambris bas -->
  <rect y="330" width="1600" height="230" fill="#4a2620"/>
  <g stroke="#3a1c17" stroke-width="4">
    <line x1="0" y1="330" x2="1600" y2="330"/>
  </g>
  <!-- Fenêtres de nuit -->
  <g>
    <rect x="40" y="60" width="210" height="230" rx="8" fill="#2a1712"/>
    <rect x="54" y="74" width="182" height="202" fill="url(#window)"/>
    <line x1="145" y1="74" x2="145" y2="276" stroke="#2a1712" stroke-width="8"/>
    <line x1="54" y1="175" x2="236" y2="175" stroke="#2a1712" stroke-width="8"/>
    <circle cx="200" cy="110" r="14" fill="#f4e6b0" opacity="0.8"/>
    <rect x="1350" y="60" width="210" height="230" rx="8" fill="#2a1712"/>
    <rect x="1364" y="74" width="182" height="202" fill="url(#window)"/>
    <line x1="1455" y1="74" x2="1455" y2="276" stroke="#2a1712" stroke-width="8"/>
    <line x1="1364" y1="175" x2="1546" y2="175" stroke="#2a1712" stroke-width="8"/>
  </g>
  <!-- Enseigne -->
  <g>
    <rect x="620" y="18" width="360" height="60" rx="10" fill="#1A1020" stroke="#FFC93C" stroke-width="5"/>
    <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#FFC93C" letter-spacing="4">CAFÉ DU COIN</text>
  </g>
  <!-- Horloge -->
  <g transform="translate(1292 64)">
    <circle r="30" fill="#fff7e8" stroke="#2a1712" stroke-width="7"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#1A1020" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="6" stroke="#1A1020" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Étagères et bouteilles -->
  <g>
    <rect x="300" y="190" width="1000" height="12" fill="#3a1c17"/>
    <rect x="300" y="290" width="1000" height="12" fill="#3a1c17"/>
    <g id="bottles1" transform="translate(0 40)">
      <rect x="320" y="96" width="22" height="54" rx="5" fill="#2f7a4a"/><rect x="326" y="80" width="10" height="20" fill="#2f7a4a"/>
      <rect x="356" y="104" width="24" height="46" rx="5" fill="#b8862e"/><rect x="363" y="90" width="10" height="16" fill="#b8862e"/>
      <rect x="394" y="92" width="20" height="58" rx="5" fill="#7a2030"/><rect x="399" y="76" width="10" height="20" fill="#7a2030"/>
      <rect x="428" y="108" width="26" height="42" rx="6" fill="#d9d2c0"/><rect x="436" y="94" width="10" height="16" fill="#d9d2c0"/>
      <rect x="468" y="98" width="22" height="52" rx="5" fill="#2a5a8a"/><rect x="474" y="82" width="10" height="18" fill="#2a5a8a"/>
    </g>
    <use href="#bottles1" x="220"/>
    <use href="#bottles1" x="620"/>
    <use href="#bottles1" x="790"/>
    <use href="#bottles1" x="110" y="100"/>
    <use href="#bottles1" x="440" y="100"/>
    <use href="#bottles1" x="720" y="100"/>
    <!-- Miroir -->
    <rect x="700" y="212" width="200" height="66" rx="6" fill="#c9b7a0" opacity="0.35"/>
  </g>
  <!-- Comptoir -->
  <rect x="140" y="378" width="1320" height="26" rx="6" fill="#a0602f"/>
  <rect x="160" y="404" width="1280" height="156" fill="url(#counter)"/>
  <g stroke="#4a2612" stroke-width="5" opacity="0.7">
    <line x1="380" y1="404" x2="380" y2="560"/>
    <line x1="620" y1="404" x2="620" y2="560"/>
    <line x1="860" y1="404" x2="860" y2="560"/>
    <line x1="1100" y1="404" x2="1100" y2="560"/>
  </g>
  <rect x="160" y="540" width="1280" height="20" fill="#3a1c10"/>
  <!-- Pompe à bière et verres sur le comptoir -->
  <g fill="#d9c18a" stroke="#5c3219" stroke-width="3">
    <rect x="770" y="330" width="16" height="50"/>
    <rect x="812" y="330" width="16" height="50"/>
    <rect x="760" y="322" width="80" height="12" rx="4"/>
  </g>
  <g fill="#f3e3b0" opacity="0.85">
    <rect x="300" y="350" width="20" height="28" rx="3"/>
    <rect x="1240" y="346" width="22" height="32" rx="3"/>
    <rect x="1280" y="352" width="18" height="26" rx="3"/>
  </g>

  <!-- Sol -->
  <rect y="560" width="1600" height="340" fill="url(#tiles)"/>
  <rect y="560" width="1600" height="340" fill="url(#floor)" opacity="0.55"/>
  <!-- Ring en scotch blanc -->
  <g fill="none" stroke="#f4efe2" stroke-width="10" stroke-linejoin="round" opacity="0.92">
    <polygon points="230,640 1370,640 1520,880 80,880"/>
    <line x1="800" y1="640" x2="800" y2="880" stroke-dasharray="26 18"/>
  </g>
  <!-- Lampes suspendues et halos -->
  <g>
    <line x1="420" y1="0" x2="420" y2="40" stroke="#1A1020" stroke-width="4"/>
    <path d="M390 40 h60 l18 34 h-96 z" fill="#2f5a3a"/>
    <line x1="1180" y1="0" x2="1180" y2="40" stroke="#1A1020" stroke-width="4"/>
    <path d="M1150 40 h60 l18 34 h-96 z" fill="#2f5a3a"/>
    <ellipse cx="420" cy="200" rx="460" ry="420" fill="url(#lamp)"/>
    <ellipse cx="1180" cy="200" rx="460" ry="420" fill="url(#lamp)"/>
    <ellipse cx="800" cy="760" rx="820" ry="230" fill="url(#lamp)"/>
  </g>
</svg>
